name: Fun Industrial FIAL5.7 Verified Business Outcomes CI
on:
  push:
    branches:
      - feature/fial5-7-verifiable-business-outcomes-20261114
    paths:
      - 'src/outcomes/**'
      - 'src/operator/executive-console-v1.mjs'
      - 'scripts/Run-Fun-Outcome-V5-7.mjs'
      - 'scripts/Run-Fun-ML-Dashboard8802.mjs'
      - '*Fun*V5-7.ps1'
      - 'intelligence-checks/fial57-*.mjs'
      - '.github/workflows/fial57-verified-outcomes-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks for outcome modules and existing hub
        shell: pwsh
        run: |
          $files=@(
           'src/outcomes/outcome-engine-v5-7.mjs',
           'src/outcomes/elektron-send-v5-7.mjs',
           'src/outcomes/outcome-console-v5-7.js',
           'scripts/Run-Fun-Outcome-V5-7.mjs',
           'scripts/Run-Fun-ML-Dashboard8802.mjs',
           'src/operator/executive-console-v1.mjs',
           'intelligence-checks/fial57-outcomes-case.mjs',
           'intelligence-checks/fial57-dashboard-case.mjs')
          foreach($path in $files){
           node --check $path
           if($LASTEXITCODE -ne 0){throw ('FIAL57_JAVASCRIPT_SYNTAX_HOLD='+$path)}
          }
      - name: Outcome and complete predecessor dashboard regressions
        run: |
          node --test intelligence-checks/fial57-outcomes-case.mjs intelligence-checks/fial57-dashboard-case.mjs intelligence-checks/fial56-business-competence-case.mjs intelligence-checks/fial56-primary-business-dashboard-case.mjs intelligence-checks/fial55-real-operations-case.mjs intelligence-checks/fial55-primary-dashboard-case.mjs intelligence-checks/fial55-elektron-mail-case.mjs intelligence-checks/fial54-executive-operator-v1-case.mjs intelligence-checks/fial54-primary-console-v1-case.mjs intelligence-checks/fial-primary-dashboard-chat-v5-3-case.mjs intelligence-checks/fial-grounded-qwen-v5-2-case.mjs intelligence-checks/fi-ml-hub-v3-case.mjs intelligence-checks/integrated-hub-ui-v1-case.mjs
      - name: Parse PowerShell and keep existing task upgrade narrowly bounded
        shell: pwsh
        run: |
          foreach($path in @(
           'Run-Fun-Verified-Outcomes-V5-7.ps1',
           'Install-Fun-Verified-Outcomes-V5-7.ps1',
           'Deploy-Fun-FIAL57-PrimaryDashboard.ps1',
           'Activate-Fun-Verified-Outcomes-V5-7.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count){$errors|ForEach-Object{Write-Error $_.Message};throw ('FIAL57_PS_PARSE_HOLD='+$path)}
            $text=Get-Content $path -Raw
            if($text -match '(?im)^\s*\$(home|pid|host|input|error|matches)\s*='){
             throw ('FIAL57_RESERVED_VARIABLE_HOLD='+$path)
            }
            if((($path -ne 'Deploy-Fun-FIAL57-PrimaryDashboard.ps1') -and ($text -match 'Stop-Process')) -or
               ($text -match 'Restart-Service|Invoke-Expression|git reset|Set-NetFirewallRule|winget install|pip install')){
             throw ('FIAL57_PROTECTED_MUTATION_HOLD='+$path)
            }
          }
          $installer=Get-Content 'Install-Fun-Verified-Outcomes-V5-7.ps1' -Raw
          foreach($guard in @('UNKNOWN_TASK_ACTION_WILL_NOT_REPLACE',
           'FIAL57_FIRST_REAL_OBSERVATION=PASS',
           'FIAL57_ROLLBACK_RESTORED_FIAL56=PASS',
           'FIAL57_NO_AUTOMATIC_EMAIL_SENDING=TRUE',
           'FIAL57_FOUR_DAILY_TRIGGERS=PRESERVED')){
            if(!$installer.Contains($guard)){throw ('FIAL57_SCHEDULER_GUARD_MISSING='+$guard)}
          }
          $activate=Get-Content 'Activate-Fun-Verified-Outcomes-V5-7.ps1' -Raw
          foreach($name in @('FIAL57_PHASE_1=LOCAL_SCHEDULER_AND_OUTCOME_LEDGER_PASS',
           'FIAL57_PHASE_2=PRIMARY_DASHBOARD_AND_QWEN_PASS',
           'FIAL57_ALL_IN_ONE=PASS')){
            if(!$activate.Contains($name)){throw ('FIAL57_ORCHESTRATOR_INCOMPLETE='+$name)}
          }
          Write-Host 'FIAL57_WINDOWS_SCHEDULER_AND_ALL_IN_ONE_GUARDS=PASS'
      - name: Exercise actual PowerShell dashboard readiness with mocked real statuses
        shell: pwsh
        run: |
          $file=Join-Path $PWD 'Deploy-Fun-FIAL57-PrimaryDashboard.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'FIAL57_DEPLOY_PARSE_FAILED'}
          $functions=$ast.FindAll({param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'ReadyNew'
          },$true)
          if(@($functions).Count -ne 1){throw 'FIAL57_READY_NEW_MISSING'}
          $fixture=@'
          Set-StrictMode -Version Latest
          $Runner='C:\test\scripts\Run-Fun-ML-Dashboard8802.mjs'
          $Url='http://127.0.0.1:8802'
          $OldCommerceShopifyConfigured=$false
          $ElevateOutcome=$false
          function Hold([string]$message){throw ('MOCK_HOLD='+$message)}
          function Owner([int]$port){
            if($port -ne 8802){throw 'WRONG_PORT'}
            return [pscustomobject]@{ProcessId=9090;CommandLine=('node.exe "'+$Runner+'" --serve')}
          }
          function GetJson([string]$path){
            switch($path){
              '/api/fun/hub/status' {return [pscustomobject]@{version='fi-ml-hub-v3'}}
              '/api/ml/dashboard/status' {return [pscustomobject]@{state='ready'}}
              '/api/fial/grounded/status' {return [pscustomobject]@{
                version='fial5.3-primary-grounded-chat-v1';model_interface='fixed_local_qwen_8088'
                memory_interface='fixed_readonly_cognee_8789';authority_added=$false;tool_executions=0}}
              '/api/commerce/status' {return [pscustomobject]@{version='commerce';shopify=[pscustomobject]@{configured=$false}}}
              '/api/unified/status' {return [pscustomobject]@{state='ready'}}
              '/api/operator/status' {return [pscustomobject]@{
                version='fial5.4-executive-operator-v1';console_version='fial5.4-executive-console-v1'
                outbound_permissions=[pscustomobject]@{email_sent=0;government_filings=0;spent_usd=0;rea_runs=0}}}
              '/api/operator/real/status' {return [pscustomobject]@{
                version='fial5.5-real-business-operations-v1'
                company_identity_status='OPERATOR_PROVIDED_NOT_OFFICIALLY_VERIFIED'
                government_filings=0;emails_sent=0;payments=0;rea_executions=0;applied_configs=0}}
              '/api/operator/competence/status' {return [pscustomobject]@{
                version='fial5.6-business-operator-v1'
                state='EXECUTED_LOCAL_BUSINESS_COMPETENCE_CYCLE'
                actions=[pscustomobject]@{mail_sent=0;
                 government_filings=0;rea_executions=0;code_mutations=0;model_invocations=0}}}
              '/api/operator/outcomes/status' {return [pscustomobject]@{
                version='fial5.7-verified-outcomes-v1';external_form_submissions=0;
                verified_customer_revenue=$(if($ElevateOutcome){1}else{0});
                certified_license_status=$false;send_attempts=0}}
              default {throw ('UNEXPECTED_READ='+$path)}
            }
          }
          function Invoke-WebRequest {
            param([string]$Uri,[switch]$UseBasicParsing,[int]$TimeoutSec)
            if($Uri.EndsWith('/unified/?view=chat')){
              return [pscustomobject]@{StatusCode=200;Content='id="fi-fial53-grounded" id="action-review" fi-ml-panel fi-commerce-panel'}
            }
            if($Uri.EndsWith('/api/fial/grounded/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='x-fi-chat-click textContent'}
            }
            if($Uri.EndsWith('/operations/')){
              return [pscustomobject]@{StatusCode=200;Content='fi-exec-queue Executive Assistant fi-real-work fi-competence-question fi-outcome-status'}
            }
            if($Uri.EndsWith('/api/operator/client.js') -or $Uri.EndsWith('/api/operator/real/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent'}
            }
            if($Uri.EndsWith('/api/operator/outcomes/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent'}
            }
            if($Uri.EndsWith('/api/operator/competence/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent x-fi-business-click'}
            }
            if($Uri.EndsWith('/')){return [pscustomobject]@{StatusCode=200;Content='fi-ui-shell'}}
            throw ('UNEXPECTED_HTML='+$Uri)
          }
          $homeBefore=$HOME
          ReadyNew 9090
          if($HOME -cne $homeBefore){throw 'FIAL57_HOME_CHANGED'}
          $ElevateOutcome=$true
          $held=$false
          try{ReadyNew 9090}catch{
            if([string]$_.Exception.Message -match 'NEW_DASHBOARD_HEALTH_OR_POLICY_MISMATCH'){$held=$true}
            else{throw}
          }
          if(!$held){throw 'FIAL57_FORGED_OUTCOME_NOT_REJECTED'}
          $held=$false
          try{ReadyNew 9091}catch{
            if([string]$_.Exception.Message -match 'NEW_8802_OWNER_DRIFT'){$held=$true}
            else{throw}
          }
          if(!$held){throw 'FIAL57_WRONG_OWNER_NOT_REJECTED'}
          Write-Host 'FIAL57_REAL_WINDOWS_READINESS_FUNCTION=PASS'
          '@
          & ([scriptblock]::Create($functions[0].Extent.Text+[Environment]::NewLine+$fixture))
      - name: Verify old source blob pins and protected dashboard rollback markers
        shell: pwsh
        run: |
          $runnerHash=(git hash-object --path=Run-Fun-Business-Competence-V5-6.ps1 -- Run-Fun-Business-Competence-V5-6.ps1 | Out-String).Trim()
          $dashboardHash=(git hash-object --path=scripts/Run-Fun-ML-Dashboard8802.mjs -- scripts/Run-Fun-ML-Dashboard8802.mjs | Out-String).Trim()
          if($runnerHash -cne '0a95e6d84f20a3e08a8af30575fe1ed61f4c8aa4'){
           throw ('FIAL57_PRIOR_TASK_BLOB_MISMATCH='+$runnerHash)
          }
          # Dashboard source changes in this release; the pinned FIAL5.6 value is checked against
          # its previous branch by the live deployment, not the modified current version.
          $deployer=Get-Content 'Deploy-Fun-FIAL57-PrimaryDashboard.ps1' -Raw
          foreach($guard in @('FIAL57_PRIMARY_DASHBOARD_CONSOLIDATION=PASS',
           'FIAL57_ROLLBACK_OLD_PRIMARY_DASHBOARD=PASS',
           'OLD_DASHBOARD_SOURCE_NOT_REVIEWED',
           'OUTCOME_EVIDENCE_RECEIPT_MISSING',
           'PROTECTED_PROCESS_CHANGED_PORT_')){
            if(!$deployer.Contains($guard)){throw ('FIAL57_DASHBOARD_GUARD_MISSING='+$guard)}
          }
          Write-Host 'FIAL57_PINNED_PRIOR_AND_ROLLBACK_CONTRACT=PASS'
      - name: No personal business profile or executable automatic sending in public code
        shell: pwsh
        run: |
          $files=@('src/outcomes/outcome-engine-v5-7.mjs',
            'src/outcomes/elektron-send-v5-7.mjs',
            'scripts/Run-Fun-Outcome-V5-7.mjs',
            'Run-Fun-Verified-Outcomes-V5-7.ps1')
          $all=($files|ForEach-Object {Get-Content $_ -Raw}) -join ''
          foreach($private in @('760-912-0784','B20260233096','13479 Abbot','elektronindustrial@gmail.com')){
            if($all.Contains($private)){throw 'FIAL57_PRIVATE_PROFILE_LEAK_IN_PUBLIC_SOURCE'}
          }
          $scheduled=Get-Content 'Run-Fun-Verified-Outcomes-V5-7.ps1' -Raw
          if($scheduled -match 'send-approved-stdin|connect-send|GmailSend|messages/send'){
            throw 'FIAL57_SCHEDULED_WORKER_HAS_SEND_ENTRYPOINT'
          }
          Write-Host 'FIAL57_PRIVACY_AND_NO_AUTOSEND=PASS'
