name: Fun Industrial Security Primary 8789 Phase 5
on:
  push:
    paths:
      - 'src/security/defensive-audit.mjs'
      - 'src/security/security-chat-client.js'
      - 'scripts/patch-security-primary-8789.mjs'
      - 'Deploy-Fun-Security-Primary-8789.ps1'
      - 'intelligence-checks/security-primary-8789-case.mjs'
      - 'intelligence-checks/security-chat-phase4-case.mjs'
      - '.github/workflows/fun-security-primary-8789-ci.yml'
  pull_request:
    paths:
      - 'src/security/defensive-audit.mjs'
      - 'src/security/security-chat-client.js'
      - 'scripts/patch-security-primary-8789.mjs'
      - 'Deploy-Fun-Security-Primary-8789.ps1'
      - 'intelligence-checks/security-primary-8789-case.mjs'
      - 'intelligence-checks/security-chat-phase4-case.mjs'
      - '.github/workflows/fun-security-primary-8789-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary-chat-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check src/security/defensive-audit.mjs && node --check src/security/security-chat-client.js && node --check scripts/patch-security-primary-8789.mjs
      - name: Synthetic patch safety and scanning tests
        run: node --test intelligence-checks/security-primary-8789-case.mjs intelligence-checks/security-chat-phase4-case.mjs intelligence-checks/local-security-scan-case.mjs
      - name: Default CLI is non-connecting preview
        run: node src/security/defensive-audit.mjs preview .
      - name: Parse Windows deployment script without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tok=$null; $err=$null; [Management.Automation.Language.Parser]::ParseFile((Resolve-Path './Deploy-Fun-Security-Primary-8789.ps1').Path,[ref]$tok,[ref]$err) | Out-Null
          if($err.Count){$err | Format-List | Out-String | Write-Host; throw 'DEPLOYMENT_POWERSHELL_SYNTAX_HOLD'}
          Write-Host 'FUN_SECURITY_DEPLOYMENT_POWERSHELL_PARSE=PASS'
