name: Fun Industrial Offline Voice Pitch Lab CI
on:
  push:
    branches:
      - feature/fun-iphone-voice-dashboard-20261108
    paths:
      - "voice_lab/**"
      - "tests/test_voice_*.py"
      - "requirements-voice.txt"
      - "Setup-Fun-VoiceLab.ps1"
      - "Prepare-Fun-Voice-Replication-Models.ps1"
      - "Setup-Fun-Voice-Replication-Runtime.ps1"
      - "Test-Fun-Voice-Replication-First-Wav.ps1"
      - ".github/workflows/voice-pitch-lab-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-pitch-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only voice analysis dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-voice.txt
      - name: Compile offline voice source
        run: python -m compileall -q voice_lab
      - name: Test synthetic voice pitch correction, acoustic analysis, and consent gates
        run: python -m unittest discover -s tests -p "test_voice_*.py" -v
      - name: Verify no-model-download local CLI
        run: python -m voice_lab status
  windows-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated voice installer syntax without executing it
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          foreach($file in @('Setup-Fun-VoiceLab.ps1','Prepare-Fun-Voice-Replication-Models.ps1','Setup-Fun-Voice-Replication-Runtime.ps1','Test-Fun-Voice-Replication-First-Wav.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),[ref]$tokens,[ref]$errors
            )|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw ('FUN_VOICE_PARSE_HOLD '+$file)}
            Write-Host ('FUN_VOICE_SCRIPT_PARSE=PASS FILE='+$file+' NO_SERVICES_TOUCHED=TRUE')
          }
          $prepare=Get-Content 'Prepare-Fun-Voice-Replication-Models.ps1' -Raw
          foreach($needle in @('9652c27e92b6b2a91632590ac9962ef7ae2b712e5c5b7f4c34ec55ee2b37ab9e',
            '6a3798229b1114f0e9cc137b33211809def7dda5a8a9398d5a112c0b42699177',
            '959433dc1c6df618922560b4b7bc8c7af0a4b7ceaea267480c5d9ae8a3cfe536')){
            if(-not $prepare.Contains($needle)){throw 'MODEL_SHA256_EXPECTATION_MISSING'}
          }
          if($prepare -match 'Stop-Process|Restart-Service|Register-ScheduledTask|Set-NetFirewallRule'){
            throw 'MODEL_PREP_UNRELATED_SERVICE_MUTATION_HOLD'
          }
          Write-Host 'FUN_VOICE_CHECKPOINT_PINS=PASS EXPECTED_HASHES=3'
          $install=Get-Content 'Setup-Fun-Voice-Replication-Runtime.ps1' -Raw
          $test=Get-Content 'Test-Fun-Voice-Replication-First-Wav.ps1' -Raw
          foreach($code in @($install,$test)){
            if($code -match 'Stop-Process|Restart-Service|Register-ScheduledTask|Set-NetFirewallRule|netbird\s+(up|down)'){
              throw 'REPLICATION_SERVICE_MUTATION_HOLD'
            }
          }
          if(-not $install.Contains('74a1d147b17a8c3092dd5430504bd83ef6c7eb23') -or
             -not $test.Contains('SYNTHESIZE VOICE ')){
            throw 'REPLICATION_UPSTREAM_OR_APPROVAL_INVARIANT_HOLD'
          }
          Write-Host 'FUN_VOICE_REPLICATION_WINDOWS_SAFETY=PASS NO_SERVICE_MUTATIONS=TRUE'
