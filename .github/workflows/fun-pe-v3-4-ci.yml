name: Fun verified Windows PE inspection V3.4
on:
  push:
    branches:
      - feature/fun-pe-inspection-v3-4-20261112
  pull_request:
    paths:
      - 'src/experimental/verified-pe-inspection-v3-4.mjs'
      - 'src/experimental/unified-task-chat.mjs'
      - 'src/experimental/unified-task-client.js'
      - 'scripts/Run-Fun-Unified-Chat8798.mjs'
      - 'intelligence-checks/verified-pe-inspection-v3-4-case.mjs'
      - 'Start-Fun-Unified-Chat8798.ps1'
      - 'Repair-Fun-Unified-Web8798.ps1'
      - '.github/workflows/fun-pe-v3-4-ci.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Static source and browser syntax
        run: |
          node --check src/experimental/verified-pe-inspection-v3-4.mjs
          node --check src/experimental/unified-task-chat.mjs
          node --check src/experimental/unified-task-client.js
          node --check scripts/Run-Fun-Unified-Chat8798.mjs
          node --check intelligence-checks/verified-pe-inspection-v3-4-case.mjs
      - name: All V1-V3.4 offline tests, synthetic MCP only
        run: node --test intelligence-checks/verified-pe-inspection-v3-4-case.mjs intelligence-checks/rea229-full-case.mjs intelligence-checks/verified-binary-layout-v3-2-case.mjs intelligence-checks/verified-file-v3-1-case.mjs intelligence-checks/verified-rea-v3-case.mjs intelligence-checks/unified-task-chat-case.mjs intelligence-checks/adaptive-capability-v2-case.mjs
      - name: Windows PowerShell parsing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach($p in @('Start-Fun-Unified-Chat8798.ps1','Repair-Fun-Unified-Web8798.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw ('V34_SCRIPT_PARSE_HOLD_'+$p)}
          }
          Write-Host 'V34_WINDOWS_PS_PARSE=PASS'
