name: Fun Verified Binary Layout V3.2 qualification
on:
  push:
    branches:
      - feature/fun-general-binary-layout-v3-2-20261111
  pull_request:
    paths:
      - 'src/experimental/verified-file-v3-1.mjs'
      - 'src/experimental/verified-binary-layout-v3-2.mjs'
      - 'src/experimental/unified-task-chat.mjs'
      - 'src/experimental/unified-task-client.js'
      - 'scripts/Run-Fun-Unified-Chat8798.mjs'
      - 'scripts/Diagnose-Fun-Verified-File-V31.mjs'
      - 'intelligence-checks/verified-file-v3-1-case.mjs'
      - 'intelligence-checks/verified-binary-layout-v3-2-case.mjs'
      - 'scripts/Diagnose-Fun-Verified-Binary-V32.mjs'
      - 'Start-Fun-Unified-Chat8798.ps1'
      - 'Repair-Fun-Unified-Web8798.ps1'
      - '.github/workflows/fun-verified-file-v3-1-ci.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Syntax checks
        run: |
          node --check src/experimental/verified-file-v3-1.mjs
          node --check src/experimental/verified-binary-layout-v3-2.mjs
          node --check scripts/Diagnose-Fun-Verified-Binary-V32.mjs
          node --check src/experimental/unified-task-chat.mjs
          node --check src/experimental/unified-task-client.js
          node --check scripts/Run-Fun-Unified-Chat8798.mjs
          node --check scripts/Diagnose-Fun-Verified-File-V31.mjs
          node --check intelligence-checks/verified-file-v3-1-case.mjs
          node --check intelligence-checks/verified-binary-layout-v3-2-case.mjs
      - name: All V1 V2 V3 and V3.1 offline qualifications
        run: node --test intelligence-checks/unified-task-chat-case.mjs intelligence-checks/adaptive-capability-v2-case.mjs intelligence-checks/verified-rea-v3-case.mjs intelligence-checks/verified-file-v3-1-case.mjs intelligence-checks/verified-binary-layout-v3-2-case.mjs
      - name: Windows startup and repair PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach($script in @('Start-Fun-Unified-Chat8798.ps1','Repair-Fun-Unified-Web8798.ps1')){
            $tokens=$null
            $errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | Format-List | Out-String | Write-Host; throw ('V32_PS_PARSE_HOLD_'+$script)}
          }
          Write-Host 'V32_PS_PARSE=PASS'
