name: Fun EV Engineering V1 (source-only)
on:
  push:
    branches:
      - feature/fun-ev-engineering-workspace-v1-20261114
    paths:
      - 'src/ev-conversion/**'
      - 'test/ev-engineering-v1.test.mjs'
      - '.github/workflows/fun-ev-engineering-v1-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concept-project-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check src/ev-conversion/catalog.mjs
          node --check src/ev-conversion/cli.mjs
      - name: Offline EV module tests only
        run: node --test test/ev-engineering-v1.test.mjs
