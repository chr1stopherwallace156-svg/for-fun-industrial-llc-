name: Fun Unified Task Chat 8798 qualification
on:
  push:
    branches:
      - feature/fun-unified-task-chat-8798-v1-20261111
  pull_request:
    paths:
      - 'src/experimental/unified-task-chat.mjs'
      - 'src/experimental/unified-public-web.mjs'
      - 'src/experimental/unified-fact-guard.mjs'
      - 'scripts/Diagnose-Fun-Unified-Web8798.mjs'
      - 'src/experimental/unified-task-client.js'
      - 'scripts/Run-Fun-Unified-Chat8798.mjs'
      - 'Start-Fun-Unified-Chat8798.ps1'
      - 'Repair-Fun-Unified-Web8798.ps1'
      - 'intelligence-checks/unified-task-chat-case.mjs'
      - '.github/workflows/fun-unified-task-chat-ci.yml'
permissions:
  contents: read
jobs:
  unified-chat:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: |
          node --check src/experimental/unified-task-chat.mjs
          node --check src/experimental/unified-public-web.mjs
          node --check src/experimental/unified-fact-guard.mjs
          node --check scripts/Diagnose-Fun-Unified-Web8798.mjs
          node --check src/experimental/unified-task-client.js
          node --check scripts/Run-Fun-Unified-Chat8798.mjs
          node --check intelligence-checks/unified-task-chat-case.mjs
      - name: Unified chat offline qualification
        run: node --test intelligence-checks/unified-task-chat-case.mjs
      - name: Windows bootstrap parser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          foreach($script in @('Start-Fun-Unified-Chat8798.ps1','Repair-Fun-Unified-Web8798.ps1')){
            $tokens=$null
            $errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | Format-List | Out-String | Write-Host; throw ('UNIFIED_PS_PARSE_HOLD_'+$script)}
          }
          if($errors.Count){$errors | Format-List | Out-String | Write-Host; throw 'UNIFIED_PS_PARSE_HOLD'}
          Write-Host 'FUN_UNIFIED_PS_PARSE=PASS'
