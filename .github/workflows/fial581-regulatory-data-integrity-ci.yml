name: Fun Industrial FIAL5.8.1 Amendment and BLS Integrity Repair CI
on:
  push:
    branches:
      - repair/fial58-2026-amendment-data-integrity-20261114
    paths:
      - 'src/regulatory/**'
      - 'src/fial/grounded-chat-v5-2.mjs'
      - 'src/operator/executive-console-v1.mjs'
      - 'scripts/Run-Fun-ML-Dashboard8802.mjs'
      - 'scripts/Run-Fun-Regulatory-Economic-V5-8.mjs'
      - '*Fun*V5-8.ps1'
      - 'intelligence-checks/fial58-*.mjs'
      - '.github/workflows/fial581-regulatory-data-integrity-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse real source monitor and unchanged business system
        shell: pwsh
        run: |
          $files=@("src/regulatory/rule-catalog-v5-8.mjs","src/regulatory/intelligence-engine-v5-8.mjs","src/regulatory/regulatory-console-v5-8.js","src/regulatory/regulatory-qwen-v5-8.mjs","scripts/Run-Fun-Regulatory-Economic-V5-8.mjs","src/fial/grounded-chat-v5-2.mjs","scripts/Run-Fun-ML-Dashboard8802.mjs","src/operator/executive-console-v1.mjs","intelligence-checks/fial58-regulatory-intelligence-case.mjs","intelligence-checks/fial58-regulatory-dashboard-case.mjs")
          foreach($path in $files){node --check $path;if($LASTEXITCODE -ne 0){throw ('FIAL58_NODE_PARSE='+$path)}}
      - name: Test official data, business models and full dashboard regressions
        run: |
          node --test intelligence-checks/fial58-regulatory-intelligence-case.mjs intelligence-checks/fial58-regulatory-dashboard-case.mjs intelligence-checks/fial57-outcomes-case.mjs intelligence-checks/fial57-dashboard-case.mjs intelligence-checks/fial56-business-competence-case.mjs intelligence-checks/fial56-primary-business-dashboard-case.mjs intelligence-checks/fial55-real-operations-case.mjs intelligence-checks/fial55-primary-dashboard-case.mjs intelligence-checks/fial55-elektron-mail-case.mjs intelligence-checks/fial54-executive-operator-v1-case.mjs intelligence-checks/fial54-primary-console-v1-case.mjs intelligence-checks/fial-primary-dashboard-chat-v5-3-case.mjs intelligence-checks/fial-grounded-qwen-v5-2-case.mjs intelligence-checks/fi-ml-hub-v3-case.mjs intelligence-checks/integrated-hub-ui-v1-case.mjs
      - name: Parse Windows scheduling and enforce no new authority
        shell: pwsh
        run: |
          foreach($path in @('Run-Fun-Regulatory-Economic-V5-8.ps1',
           'Install-Fun-Regulatory-Economic-V5-8.ps1',
           'Deploy-Fun-FIAL58-PrimaryDashboard.ps1',
           'Activate-Fun-Regulatory-Economic-V5-8.ps1')){
            $tok=$null;$errs=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tok,[ref]$errs)|Out-Null
            if(@($errs).Count){throw ('FIAL58_WINDOWS_SCRIPT_PARSE='+$path)}
            $content=Get-Content $path -Raw
            if($content -match '(?im)^\s*\$(home|pid|host|input|error|matches)\s*='){throw 'FIAL58_MUTATES_AUTOMATIC_VARIABLE'}
            if((($path -ne 'Deploy-Fun-FIAL58-PrimaryDashboard.ps1') -and $content -match 'Stop-Process') -or
              $content -match 'Invoke-Expression|Restart-Service|git reset|pip install|winget install'){
              throw 'FIAL58_UNREVIEWED_MUTATION'
            }
          }
          $install=Get-Content 'Install-Fun-Regulatory-Economic-V5-8.ps1' -Raw
          foreach($guard in @('UNKNOWN_SCHEDULE_ACTION_REFUSE_REPLACE',
           'FIAL58_FIRST_REAL_CYCLE=PASS','FIAL58_RESTORED_PREVIOUS_FIAL57_TASK=PASS',
           'FIAL58_FOUR_DAILY_TRIGGERS=PRESERVED')){
           if(!$install.Contains($guard)){throw ('FIAL58_MISSING_SCHEDULE_GUARD='+$guard)}
          }
          $actual=(git hash-object --path=Run-Fun-Regulatory-Economic-V5-8.ps1 -- Run-Fun-Regulatory-Economic-V5-8.ps1 | Out-String).Trim()
          if($actual -cne 'fa2ebe4a46654ab299520bbb1ae3901526a5b92a'){throw ('FIAL58_OLD_RUNNER_PIN_MISMATCH='+$actual)}
          Write-Host 'FIAL58_WINDOWS_TASK_GUARDS_AND_PIN=PASS'
      - name: Exercise actual PowerShell dashboard readiness with mocked real statuses
        shell: pwsh
        run: |
          $file=Join-Path $PWD 'Deploy-Fun-FIAL58-PrimaryDashboard.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'FIAL58_DEPLOY_PARSE_FAILED'}
          $functions=$ast.FindAll({param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'ReadyNew'
          },$true)
          if(@($functions).Count -ne 1){throw 'FIAL58_READY_NEW_MISSING'}
          $fixture=@'
          Set-StrictMode -Version Latest
          $Runner='C:\test\scripts\Run-Fun-ML-Dashboard8802.mjs'
          $Url='http://127.0.0.1:8802'
          $OldCommerceShopifyConfigured=$false
          $ElevateOutcome=$false
          $ElevateRegulatory=$false
          function Hold([string]$message){throw ('MOCK_HOLD='+$message)}
          function Owner([int]$port){
            if($port -ne 8802){throw 'WRONG_PORT'}
            return [pscustomobject]@{ProcessId=9090;CommandLine=('node.exe "'+$Runner+'" --serve')}
          }
          function GetJson([string]$path){
            switch($path){
              '/api/fun/hub/status' {return [pscustomobject]@{version='fi-ml-hub-v3'}}
              '/api/ml/dashboard/status' {return [pscustomobject]@{state='ready'}}
              '/api/fial/grounded/status' {return [pscustomobject]@{
                version='fial5.3-primary-grounded-chat-v1';model_interface='fixed_local_qwen_8088'
                memory_interface='fixed_readonly_cognee_8789';authority_added=$false;tool_executions=0}}
              '/api/commerce/status' {return [pscustomobject]@{version='commerce';shopify=[pscustomobject]@{configured=$false}}}
              '/api/unified/status' {return [pscustomobject]@{state='ready'}}
              '/api/operator/status' {return [pscustomobject]@{
                version='fial5.4-executive-operator-v1';console_version='fial5.4-executive-console-v1'
                outbound_permissions=[pscustomobject]@{email_sent=0;government_filings=0;spent_usd=0;rea_runs=0}}}
              '/api/operator/real/status' {return [pscustomobject]@{
                version='fial5.5-real-business-operations-v1'
                company_identity_status='OPERATOR_PROVIDED_NOT_OFFICIALLY_VERIFIED'
                government_filings=0;emails_sent=0;payments=0;rea_executions=0;applied_configs=0}}
              '/api/operator/competence/status' {return [pscustomobject]@{
                version='fial5.6-business-operator-v1'
                state='EXECUTED_LOCAL_BUSINESS_COMPETENCE_CYCLE'
                actions=[pscustomobject]@{mail_sent=0;
                 government_filings=0;rea_executions=0;code_mutations=0;model_invocations=0}}}
              '/api/operator/outcomes/status' {return [pscustomobject]@{
                version='fial5.7-verified-outcomes-v1';external_form_submissions=0;
                verified_customer_revenue=$(if($ElevateOutcome){1}else{0});
                certified_license_status=$false;send_attempts=0}}
              '/api/operator/regulatory/status' {return [pscustomobject]@{
                version='fial5.8-regulatory-economic-v1'
                state='REAL_PUBLIC_DATA_CHECK_COMPLETED'
                source_catalog_version='fial5.8.1-regulatory-catalog-2026-amendment-v1'
                authority_update='ACF_2026_FINAL_AMENDMENT_SUPERSEDES_2027_PURCHASE_RULE'
                rule_watch=@([pscustomobject]@{id='acf-state-local-purchasing'
                  effective='2030-01-01';supersedes='2027-01-01'})
                boundaries=[pscustomobject]@{emails_sent=0;automatic_filing=0;model_calls=0
                  verified_individual_due_dates=$(if($ElevateRegulatory){1}else{0})}}}
              default {throw ('UNEXPECTED_READ='+$path)}
            }
          }
          function Invoke-WebRequest {
            param([string]$Uri,[switch]$UseBasicParsing,[int]$TimeoutSec)
            if($Uri.EndsWith('/unified/?view=chat')){
              return [pscustomobject]@{StatusCode=200;Content='id="fi-fial53-grounded" id="action-review" fi-ml-panel fi-commerce-panel'}
            }
            if($Uri.EndsWith('/api/fial/grounded/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='x-fi-chat-click textContent'}
            }
            if($Uri.EndsWith('/operations/')){
              return [pscustomobject]@{StatusCode=200;Content='fi-exec-queue Executive Assistant fi-real-work fi-competence-question fi-outcome-status fi-regulatory-intelligence'}
            }
            if($Uri.EndsWith('/api/operator/client.js') -or $Uri.EndsWith('/api/operator/real/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent'}
            }
            if($Uri.EndsWith('/api/operator/regulatory/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='createElementNS textContent'}
            }
            if($Uri.EndsWith('/api/operator/outcomes/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent'}
            }
            if($Uri.EndsWith('/api/operator/competence/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent x-fi-business-click'}
            }
            if($Uri.EndsWith('/')){return [pscustomobject]@{StatusCode=200;Content='fi-ui-shell'}}
            throw ('UNEXPECTED_HTML='+$Uri)
          }
          $homeBefore=$HOME
          ReadyNew 9090
          if($HOME -cne $homeBefore){throw 'FIAL58_HOME_CHANGED'}
          $ElevateRegulatory=$true
          $held=$false
          try{ReadyNew 9090}catch{
            if([string]$_.Exception.Message -match 'NEW_DASHBOARD_HEALTH_OR_POLICY_MISMATCH'){$held=$true}
            else{throw}
          }
          if(!$held){throw 'FIAL58_FORGED_INDIVIDUAL_DUE_DATE_NOT_REJECTED'}
          $held=$false
          try{ReadyNew 9091}catch{
            if([string]$_.Exception.Message -match 'NEW_8802_OWNER_DRIFT'){$held=$true}
            else{throw}
          }
          if(!$held){throw 'FIAL58_WRONG_OWNER_NOT_REJECTED'}
          Write-Host 'FIAL58_REAL_WINDOWS_READINESS_FUNCTION=PASS'
          '@
          & ([scriptblock]::Create($functions[0].Extent.Text+[Environment]::NewLine+$fixture))
      - name: Validate source privacy and 8802 rollback controls
        shell: pwsh
        run: |
          $deploy=Get-Content 'Deploy-Fun-FIAL58-PrimaryDashboard.ps1' -Raw
          foreach($line in @('FIAL58_PRIMARY_DASHBOARD_CONSOLIDATION=PASS',
           'FIAL58_ROLLBACK_OLD_PRIMARY_DASHBOARD=PASS','REGULATORY_INTELLIGENCE_RECEIPT_MISSING',
           'OLD_DASHBOARD_SOURCE_NOT_REVIEWED','PROTECTED_PROCESS_CHANGED_PORT_')){
            if(!$deploy.Contains($line)){throw ('FIAL58_DEPLOYMENT_GUARD_MISSING='+$line)}
          }
          $src=(Get-ChildItem 'src/regulatory' -File|ForEach-Object{Get-Content $_.FullName -Raw}) -join ''
          foreach($secret in @('760-912-0784','B20260233096','13479 Abbot','elektronindustrial@gmail.com')){
            if($src.Contains($secret)){throw 'FIAL58_BUSINESS_CONTACT_IN_PUBLIC_CODE'}
          }
          $scheduled=Get-Content 'Run-Fun-Regulatory-Economic-V5-8.ps1' -Raw
          if($scheduled -match 'send-approved-stdin|connect-send|GmailSend|messages/send'){
            throw 'FIAL58_SCHEDULE_MAY_SEND_MAIL'
          }
          $catalog=Get-Content 'src/regulatory/rule-catalog-v5-8.mjs' -Raw
          if($catalog -notmatch "effective:'2030-01-01'" -or
           $catalog -notmatch "supersedes:'2027-01-01'" -or
           $catalog -notmatch "2026-09-10"){
            throw 'FIAL581_AMENDED_CARB_DEADLINE_NOT_PINNED'
          }
          $engine=Get-Content 'src/regulatory/intelligence-engine-v5-8.mjs' -Raw
          if($engine -notmatch '337.511' -or $engine -notmatch 'BLS_OCT2026_CPI_CROSS_SOURCE_MISMATCH'){
            throw 'FIAL581_BLS_CROSS_SOURCE_SANITY_CHECK_MISSING'
          }
          Write-Host 'FIAL581_ACF_2030_AND_BLS_CPI_CROSS_CHECK=PASS'
          Write-Host 'FIAL58_PRIVACY_AND_ROLLBACK_GUARDS=PASS'
