name: Fun Industrial Phase 2 and 3 Optimization CI
on:
  push:
    branches:
      - feature/fun-iphone-voice-dashboard-20261108
    paths:
      - "fun_optimization/**"
      - "src/optimization/**"
      - "scripts/patch-optimization-dashboard.mjs"
      - "intelligence-checks/optimization-phase23-case.mjs"
      - "Activate-Fun-Optimization-Phase23.ps1"
      - "tests/test_fun_optimization.py"
      - ".github/workflows/fun-optimization-phase23-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-staging-and-approval:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify client and runner syntax
        run: |
          node --check src/optimization/runner.mjs
          node --check src/optimization/client.js
          node --check src/optimization/http.mjs
          node --check scripts/patch-optimization-dashboard.mjs
      - name: Test additive patch and operator approval boundaries
        run: node --test intelligence-checks/optimization-phase23-case.mjs
      - name: Parse Windows deployment script only
        shell: pwsh
        run: |
          $tokens=$null;$problems=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Activate-Fun-Optimization-Phase23.ps1'),
            [ref]$tokens,[ref]$problems
          )|Out-Null
          if($problems.Count){$problems|ForEach-Object{Write-Error $_.Message};throw 'OPT_PHASE23_POWERSHELL_PARSE_HOLD'}
          $script=Get-Content 'Activate-Fun-Optimization-Phase23.ps1' -Raw
          foreach($marker in @('OPTIMIZATION_UNAPPROVED_RUN_DENIAL','OPTIMIZATION_PHASE2=PASS',
            'OPTIMIZATION_PHASE3=ADVISORY_UI_READY','OPTIMIZATION_PERSISTENT_SOURCE_ALREADY_EXISTS',
            'OPTIMIZATION_ROLLBACK_FILES=RESTORED','FI_VOICE_MOBILE_PANEL_V1','REA_229_CATALOG_NOT_READY')){
           if(-not $script.Contains($marker)){throw "OPT_PHASE23_SAFETY_MARKER_HOLD=$marker"}
          }
          if($script -match 'Stop-Service|Restart-Service|Set-NetFirewallRule|Register-ScheduledTask'){
            throw 'OPT_PHASE23_UNRELATED_SERVICE_MUTATION_HOLD'
          }
          Write-Host 'FUN_OPT_PHASE23_SCRIPT_PARSE=PASS BACKUP_ROLLBACK_AND_APPROVAL_GUARDS=PASS'

  python-bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded optimization dependencies
        run: python -m pip install -r requirements-optimization.txt
      - name: Test optimizer and protected subprocess bridge
        run: python -m unittest discover -s tests -p test_fun_optimization.py -v
      - name: Check offline example tools
        run: python -m fun_optimization demo
