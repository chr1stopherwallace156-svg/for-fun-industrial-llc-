name: Fun Industrial iPhone Voice Dashboard — guarded upload CI
on:
  push:
    branches:
      - feature/fun-iphone-voice-dashboard-20261108
    paths:
      - "src/voice/**"
      - "scripts/patch-iphone-voice-dashboard.mjs"
      - "scripts/check-iphone-voice-live.mjs"
      - "intelligence-checks/iphone-voice-case.mjs"
      - "intelligence-checks/iphone-safari-pcm-case.mjs"
      - "intelligence-checks/iphone-conversation-case.mjs"
      - "scripts/patch-iphone-conversation.mjs"
      - "Setup-Fun-Voice-Conversation.ps1"
      - "src/voice/conversation.mjs"
      - "src/voice/conversation-client.js"
      - "src/voice/transcribe.py"
      - "src/voice/setup-whisper-model.py"
      - "Activate-Fun-iPhone-Voice.ps1"
      - "Prepare-Fun-iPhone-HTTPS.ps1"
      - "Repair-Fun-iPhone-Safari-Recorder.ps1"
      - "Start-Fun-iPhone-HTTPS.ps1"
      - "Watch-Fun-iPhone-HTTPS.ps1"
      - "Enable-Fun-iPhone-Gateway-Autostart.ps1"
      - "Diagnose-Fun-Gateway-Scheduler.ps1"
      - "Diagnose-Fun-Gateway-Supervisor.ps1"
      - "intelligence-checks/iphone-gateway-autostart-case.mjs"
      - "intelligence-checks/iphone-gateway-port-case.ps1"
      - "src/voice/gateway-port-state.ps1"
      - "Diagnose-Fun-iPhone-HTTPS.ps1"
      - "FUN-IPHONE-HTTPS-SETUP.md"
      - "src/gateway.mjs"
      - ".github/workflows/iphone-voice-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-voice-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check source modules and browser script syntax
        run: |
          node --check src/voice/mobile-upload.mjs
          node --check src/voice/mobile-client.js
          node --check src/voice/conversation.mjs
          node --check src/voice/conversation-client.js
          node --check scripts/patch-iphone-conversation.mjs
          node --check scripts/patch-iphone-voice-dashboard.mjs
          node --check scripts/check-iphone-voice-live.mjs
          node --check src/voice/private-gateway-entry.mjs
          node --check src/voice/private-gateway-selftest.mjs
      - name: Check offline Python speech modules compile
        run: |
          python -m py_compile src/voice/transcribe.py src/voice/setup-whisper-model.py
      - name: Synthetic WAV format, upload, security and dashboard-preservation tests
        run: node --test intelligence-checks/iphone-voice-case.mjs intelligence-checks/iphone-safari-pcm-case.mjs intelligence-checks/iphone-conversation-case.mjs intelligence-checks/iphone-gateway-autostart-case.mjs

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic private HTTPS listener classification (no sockets changed)
        shell: pwsh
        run: ./intelligence-checks/iphone-gateway-port-case.ps1
      - name: Validate isolated scheduled supervisor (no secrets, no gateway changes)
        shell: pwsh
        run: |
          $results = @( & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'Diagnose-Fun-Gateway-Supervisor.ps1') 2>&1 )
          $results | ForEach-Object { Write-Host $_ }
          if (-not @($results | Where-Object { $_ -match '^FI_GATEWAY_SUPERVISOR_SCHEDULED_INSPECT=PASS\b' }).Count) {
            throw 'FI_GATEWAY_WINDOWS_SCHEDULED_SUPERVISOR_REGRESSION_HOLD'
          }
      - name: Parse deployment and compute recovery scripts without executing them
        shell: pwsh
        run: |
          foreach ($name in @('Activate-Fun-iPhone-Voice.ps1', 'Recover-Fun-Compute.ps1', 'Diagnose-Fun-iPhone-HTTPS.ps1', 'Prepare-Fun-iPhone-HTTPS.ps1', 'Start-Fun-iPhone-HTTPS.ps1', 'Repair-Fun-iPhone-Safari-Recorder.ps1', 'Setup-Fun-Voice-Conversation.ps1', 'Watch-Fun-iPhone-HTTPS.ps1', 'Enable-Fun-iPhone-Gateway-Autostart.ps1', 'Diagnose-Fun-Gateway-Scheduler.ps1', 'Diagnose-Fun-Gateway-Supervisor.ps1', 'src/voice/gateway-port-state.ps1', 'intelligence-checks/iphone-gateway-port-case.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $name), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "SCRIPT_PARSE_HOLD=$name"
            }
            Write-Host "POWERSHELL_PARSE=PASS FILE=$name"
          }
