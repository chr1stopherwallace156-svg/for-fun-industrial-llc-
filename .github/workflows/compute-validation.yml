name: Compute validation
on:
  push:
    branches: ["main", "integration/**", "feature/**"]
  pull_request:
    branches: ["main", "integration/**"]
permissions:
  contents: read
jobs:
  compute:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-compute.txt
      - name: Install graph and tensor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-compute.txt
          python -m pip install torch==2.7.0 --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run compute and AI/ML tests
        run: python -m pytest compute_service/test_compute.py ai_ml/test_ai_ml.py malware_analysis/test_static_analysis.py -q
