name: Roofing Bulk V2 regression checks
on:
  push:
    branches:
      - feature/fun-roofing-bulk-v2-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-roofing-bulk:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Python source without writing bytecode
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('src/roofing/roofing_bulk_v2.py').read_text(encoding='utf-8')); print('ROOF_PYTHON_SYNTAX=PASS')"
      - name: Test roof matching and source failure handling
        run: python -B -W error::ResourceWarning src/roofing/test_roofing_bulk_v2.py
      - name: Test selective extraction policy and transactional filtering
        run: python -B -W error::ResourceWarning src/roofing/test_selective_v3.py
      - name: Test evidence-stratified 500-property public research export
        run: python -B -W error::ResourceWarning src/roofing/test_export_roofing_pilot_v1.py
      - name: Test parallel property-age and configurable roof-permit cycle formulas
        run: python -B -W error::ResourceWarning src/roofing/test_roofing_dual_formulas_v4.py
      - name: Test age-comparable neighborhood permit cohorts (read only)
        run: python -B -W error::ResourceWarning src/roofing/test_roofing_neighbor_context_v5.py
      - name: Audit original permit-description archive sample offline
        run: python -B -W error::ResourceWarning src/roofing/test_audit_roofing_permit_descriptions_v6.py
      - name: Validate LA permit status evidence with offline SHA-pinned CSV fixtures
        run: python -B -W error::ResourceWarning src/roofing/test_audit_roofing_permit_status_v7.py
      - name: V8 bounded LA inspection join offline regression
        run: python -B -W error::ResourceWarning src/roofing/test_probe_ladbs_inspections_v8.py
      - name: Validate server and browser JavaScript syntax
        run: |
          node --check scripts/Run-Fun-ML-Dashboard8802.mjs
          node --check src/ui/roofing-bulk-page-v2.js
          node --check src/roofing/roofing-bulk-bridge-v2.mjs
          python -c "import ast,pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ('src/roofing/selective_policy_v3.py','src/roofing/selective_extract_v3.py','src/roofing/export_roofing_pilot_v1.py','src/roofing/test_export_roofing_pilot_v1.py','src/roofing/roofing_dual_formulas_v4.py','src/roofing/test_roofing_dual_formulas_v4.py','src/roofing/roofing_neighbor_context_v5.py','src/roofing/test_roofing_neighbor_context_v5.py','src/roofing/audit_roofing_permit_descriptions_v6.py','src/roofing/test_audit_roofing_permit_descriptions_v6.py','src/roofing/audit_roofing_permit_status_v7.py','src/roofing/test_audit_roofing_permit_status_v7.py','src/roofing/probe_ladbs_inspections_v8.py','src/roofing/test_probe_ladbs_inspections_v8.py')]"
          node --check src/ui/procurement-focus-v1.mjs
          node --check src/ui/organized-preview-v1.js
          node --check src/ui/oneport-dashboard-v1.js
      - name: Test existing dashboard and both roofing modules
        run: node --test test/organized-ui-preview-v1.test.mjs test/roofing-opportunity-v1.test.mjs test/roofing-bulk-v2.test.mjs test/procurement-focus-v1.test.mjs test/roofing-selective-v3.test.mjs
