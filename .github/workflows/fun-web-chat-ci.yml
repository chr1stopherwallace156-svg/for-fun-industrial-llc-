name: Fun Industrial Web-in-Chat Consolidation CI
on:
  push:
    branches:
      - feature/fun-iphone-voice-dashboard-20261108
    paths:
      - "src/intelligence/chat-web.mjs"
      - "src/intelligence/chat-web-client.js"
      - "scripts/patch-chat-web-consolidation.mjs"
      - "intelligence-checks/web-chat-consolidation-case.mjs"
      - "Activate-Fun-Web-In-Chat.ps1"
      - "Repair-Fun-Web-Chat-DDGS-Query.ps1"
      - "Deploy-Fun-Web-Chat-Token-Budget.ps1"
      - "scripts/patch-chat-web-budget-v2.mjs"
      - "intelligence-checks/web-chat-token-budget-case.mjs"
      - ".github/workflows/fun-web-chat-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-chat:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify same-origin chat modules
        run: |
          node --check src/intelligence/chat-web.mjs
          node --check src/intelligence/chat-web-client.js
          node --check scripts/patch-chat-web-consolidation.mjs
          node --check scripts/patch-chat-web-budget-v2.mjs
      - name: Test read-only web-assisted existing chat and UI consolidation
        run: node --test intelligence-checks/web-chat-consolidation-case.mjs
      - name: Test software-evidence compacting and measured token usage
        run: node --test intelligence-checks/web-chat-token-budget-case.mjs
      - name: Verify guarded Windows installer
        shell: pwsh
        run: |
          $tok=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Activate-Fun-Web-In-Chat.ps1'),[ref]$tok,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'WEB_CHAT_INSTALL_PARSE_HOLD'}
          $script=Get-Content 'Activate-Fun-Web-In-Chat.ps1' -Raw
          foreach($required in @('FUN_WEB_CHAT_DEPLOY=PASS','FUN_WEB_CHAT_ROLLBACK_FILES=RESTORED','PROTECTED_PORT_CHANGED','REA_HTTP_ACCESS_CHANGED','REA_ALLOWED_TOOLS_CHANGED','WEB_SERVICE_PROCESS_CHANGED','CHAT_CLIENT_NOT_SERVED','STAGED_HASH_MISMATCH')){
           if(-not $script.Contains($required)){throw ("WEB_CHAT_SAFETY_MARKER_MISSING_"+$required)}
          }
          if($script -match 'Stop-Service|Restart-Service|Set-NetFirewallRule|Register-ScheduledTask'){throw 'UNRELATED_SYSTEM_MUTATION_DENIED'}
          foreach($bad in @('Invoke-RestMethod "$Base/api/rea/start" -Method POST','Invoke-RestMethod "$Base/api/activate" -Method POST')){
            if($script.Contains($bad)){throw ('WEB_CHAT_UNRELATED_ACTIVATION_DENIED_'+$bad)}
          }
          $repairPath=Join-Path $PWD 'Repair-Fun-Web-Chat-DDGS-Query.ps1'
          $repairTokens=$null
          $repairErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($repairPath,[ref]$repairTokens,[ref]$repairErrors)|Out-Null
          if($repairErrors.Count){$repairErrors|ForEach-Object{Write-Error $_.Message};throw 'WEB_CHAT_QUERY_REPAIR_PARSE_HOLD'}
          $repair=Get-Content $repairPath -Raw
          foreach($required in @('FUN_WEB_CHAT_QUERY_REPAIR=PASS','FUN_WEB_CHAT_QUERY_ROLLBACK_MODULE=RESTORED','PROTECTED_SERVICE_PID_CHANGED','UNRECOGNIZED_LIVE_MODULE')){
           if(-not $repair.Contains($required)){throw ("WEB_CHAT_QUERY_REPAIR_GUARD_MISSING_"+$required)}
          }
          Write-Host 'FUN_WEB_CHAT_QUERY_REPAIR=PARSE_PASS GUARDED_DASHBOARD_ONLY_RESTART=TRUE'
          $budgetPath=Join-Path $PWD 'Deploy-Fun-Web-Chat-Token-Budget.ps1'
          $budgetTokens=$null
          $budgetErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($budgetPath,[ref]$budgetTokens,[ref]$budgetErrors)|Out-Null
          if($budgetErrors.Count){$budgetErrors|ForEach-Object{Write-Error $_.Message};throw 'WEB_TOKEN_BUDGET_INSTALL_PARSE_HOLD'}
          $budget=Get-Content $budgetPath -Raw
          foreach($required in @('FUN_WEB_TOKEN_BUDGET_DEPLOY=PASS','FUN_WEB_TOKEN_BUDGET_ROLLBACK_FILES=RESTORED','STAGED_HASH_MISMATCH','PROTECTED_SERVICE_PID_CHANGED')){
           if(-not $budget.Contains($required)){throw ('WEB_TOKEN_BUDGET_GUARD_MISSING_'+$required)}
          }
          if($budget -match 'Stop-Service|Restart-Service|Set-NetFirewallRule|Register-ScheduledTask'){throw 'WEB_TOKEN_BUDGET_UNRELATED_SYSTEM_MUTATION_DENIED'}
          Write-Host 'FUN_WEB_TOKEN_BUDGET_INSTALL=PARSE_PASS ROLLBACK_GUARDED'
          Write-Host 'FUN_WEB_CHAT_INSTALLER=PARSE_PASS ROLLBACK_GUARDED REA_POLICY_PRESERVED'
