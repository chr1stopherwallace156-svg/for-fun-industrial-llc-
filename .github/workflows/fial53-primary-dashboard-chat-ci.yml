name: Fun Industrial FIAL5.3 Primary Dashboard Chat CI
on:
  push:
    branches:
      - feature/fial5-3-primary-dashboard-grounded-chat-20261114
    paths:
      - "src/fial/primary-grounded-ui-v5-3.mjs"
      - "src/fial/primary-grounded-client-v5-3.js"
      - "src/ui/integrated-hub-v1.js"
      - "scripts/Run-Fun-ML-Dashboard8802.mjs"
      - "intelligence-checks/fial-primary-dashboard-chat-v5-3-case.mjs"
      - "intelligence-checks/integrated-hub-ui-v1-case.mjs"
      - "Deploy-Fun-FIAL53-PrimaryDashboard.ps1"
      - ".github/workflows/fial53-primary-dashboard-chat-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax checks
        shell: pwsh
        run: |
          node --check scripts/Run-Fun-ML-Dashboard8802.mjs
          node --check src/fial/primary-grounded-ui-v5-3.mjs
          node --check src/fial/primary-grounded-client-v5-3.js
          node --check src/ui/integrated-hub-v1.js
          node --check intelligence-checks/fial-primary-dashboard-chat-v5-3-case.mjs
      - name: Focused integration and previous dashboard regression tests
        run: |
          node --test intelligence-checks/fial-primary-dashboard-chat-v5-3-case.mjs intelligence-checks/fi-ml-hub-v3-case.mjs intelligence-checks/integrated-hub-ui-v1-case.mjs intelligence-checks/fial-grounded-qwen-v5-2-case.mjs intelligence-checks/commerce-opportunities-v1-1-case.mjs intelligence-checks/google-trends-focus-v1-2-case.mjs
      - name: Parse Windows 8802-only deploy and rollback controls
        shell: pwsh
        run: |
          $file=Join-Path $PWD 'Deploy-Fun-FIAL53-PrimaryDashboard.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'FIAL53_DEPLOY_POWERSHELL_PARSE_FAILED'}
          $source=Get-Content $file -Raw
          foreach($required in @('OLD_DASHBOARD_SOURCE_NOT_REVIEWED','OLD_PRIMARY_DASHBOARD_UNVERIFIED',
            'SOURCE_SYMLINK_REJECTED','PRIMARY_DASHBOARD_TESTS_FAILED_BEFORE_REPLACEMENT',
            '8802_PROCESS_OWNER_UNKNOWN_NO_RESTART','PROTECTED_PROCESS_CHANGED_PORT_',
            'FIAL53_ROLLBACK_OLD_PRIMARY_DASHBOARD=PASS','LIVE_PRIMARY_GROUNDED_QWEN_NOT_QUALIFIED',
            'FIAL53_PRIMARY_DASHBOARD_CONSOLIDATION=PASS','FIAL53_TOOLS_AND_REA_APPROVAL_UI=PRESERVED')){
            if(!$source.Contains($required)){throw ('FIAL53_DEPLOY_GUARD_MISSING_'+$required)}
          }
          if($source -match '\$ml\.state'){throw 'FIAL53_ML_WRONG_STATUS_FIELD'}
          if(!$source.Contains("$ml.version -cne 'fun-qwen-scikit-v2'") -or
             !$source.Contains('$ml.pythonInstalled -ne $true') -or
             !$source.Contains('$ml.reaExecutionGrants -ne 0') -or
             !$source.Contains('$ml.externalActions -ne 0')){
            throw 'FIAL53_ML_ACTUAL_SCHEMA_GUARDS_MISSING'
          }
          # Windows StrictMode regression: no direct .Count on a function that
          # may emit zero pipeline objects. The old script failed after stopping 8802.
          if($source -match '\(Listeners 8802\)\.Count'){
            throw 'FIAL53_STRICTMODE_EMPTY_LISTENER_REGRESSION'
          }
          foreach($marker in @('FIAL53_MISSING_8802=RECOVERING_PINNED_ORIGINAL',
            'FIAL53_PINNED_ORIGINAL_8802_RESTORED=PASS',
            'PINNED_ORIGINAL_8802_RECOVERY_FAILED_LOGS',
            'ROLLBACK_OLD_DASHBOARD_NOT_CONFIRMED',
            'if(@(Listeners 8802).Count -eq 0)')){
            if(!$source.Contains($marker)){throw ('FIAL53_MISSING_PORT_RESTORE_GUARD='+$marker)}
          }
          Set-StrictMode -Version Latest
          function EmptyListener {return @()}
          $none=@(EmptyListener)
          if($none.Count -ne 0){throw 'FIAL53_EMPTY_LISTENER_COUNT_IS_NOT_ZERO'}
          if($source -match 'Invoke-Expression|Set-NetFirewallRule|git reset|git checkout|pip install|/admin/shutdown'){
            throw 'FIAL53_UNEXPECTED_PROTECTED_MUTATION'
          }
          Write-Host 'FIAL53_DEPLOYMENT_PARSE_AND_GUARDS=PASS'
