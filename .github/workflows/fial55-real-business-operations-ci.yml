name: Fun Industrial FIAL5.5 Real Business Operations CI
on:
  push:
    branches:
      - feature/fial5-5-real-business-operations-20261114
    paths:
      - 'src/operator/**'
      - 'scripts/Run-Fun-Real-Operations-V5-5.mjs'
      - 'scripts/Run-Fun-ML-Dashboard8802.mjs'
      - 'Run-Fun-Real-Operations-V5-5.ps1'
      - 'Install-Fun-Real-Operations-V5-5.ps1'
      - 'Deploy-Fun-FIAL55-PrimaryDashboard.ps1'
      - 'intelligence-checks/fial55-*.mjs'
      - '.github/workflows/fial55-real-business-operations-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse all new modules on Windows
        shell: pwsh
        run: |
          $files=@(
            'src/operator/real-operations-v5-5.mjs',
            'src/operator/official-source-watch-v5-5.mjs',
            'src/operator/elektron-gmail-v5-5.mjs',
            'src/operator/real-operations-widget-v5-5.js',
            'src/operator/executive-ops-v1.mjs',
            'src/operator/executive-console-v1.mjs',
            'scripts/Run-Fun-Real-Operations-V5-5.mjs',
            'scripts/Run-Fun-ML-Dashboard8802.mjs',
            'intelligence-checks/fial55-real-operations-case.mjs',
            'intelligence-checks/fial55-primary-dashboard-case.mjs',
            'intelligence-checks/fial55-elektron-mail-case.mjs'
          )
          foreach($p in $files){node --check $p;if($LASTEXITCODE -ne 0){throw ('FIAL55_PARSE_HOLD='+$p)}}
      - name: Real business workflow and dashboard regressions
        run: |
          node --test intelligence-checks/fial55-real-operations-case.mjs intelligence-checks/fial55-primary-dashboard-case.mjs intelligence-checks/fial55-elektron-mail-case.mjs intelligence-checks/fial54-executive-operator-v1-case.mjs intelligence-checks/fial54-primary-console-v1-case.mjs intelligence-checks/fial-primary-dashboard-chat-v5-3-case.mjs intelligence-checks/fi-ml-hub-v3-case.mjs intelligence-checks/integrated-hub-ui-v1-case.mjs
      - name: Parse Windows schedule upgrade and verify no authority escalation
        shell: pwsh
        run: |
          foreach($p in @('Run-Fun-Real-Operations-V5-5.ps1','Install-Fun-Real-Operations-V5-5.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $p),[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count){$errors|ForEach-Object{Write-Error $_.Message};throw ('FIAL55_PS_SYNTAX_HOLD='+$p)}
            $src=Get-Content $p -Raw
            if($src -match '(?im)^\s*\$(home|pid|host|input|error|matches)\s*='){throw ('FIAL55_RESERVED_AUTOMATIC_VARIABLE='+$p)}
            if($src -match 'Stop-Process|Restart-Service|Start-Service|Remove-Item|Invoke-Expression|git reset|Set-NetFirewallRule'){
              throw ('FIAL55_PROTECTED_ACTION='+$p)
            }
          }
          $install=Get-Content 'Install-Fun-Real-Operations-V5-5.ps1' -Raw
          foreach($s in @('EXISTING_FIAL54_TASK_IDENTITY_DRIFT_REFUSE_CHANGE',
            'Export-ScheduledTask','PROFILE_REJECTED','FIAL55_FIRST_REAL_LOCAL_CYCLE=PASS',
            'FIAL55_TASK_ROLLBACK','FIAL55_EXISTING_SCHEDULE=UPGRADED_IN_PLACE_NO_SECOND_TASK',
            'FIAL55_EMAIL_OAUTH=NOT_GRANTED_NO_MAIL_SENT',
            'FIAL55_GOVERNMENT_FILINGS=NONE')){
            if(!$install.Contains($s) -and $s -ne 'PROFILE_REJECTED'){throw ('FIAL55_GUARD_MISSING='+$s)}
          }
          Write-Host 'FIAL55_SCHEDULER_GUARDS=PASS'
      - name: Execute actual Windows dashboard readiness with mocked real operator API
        shell: pwsh
        run: |
          $filename=Join-Path $PWD 'Deploy-Fun-FIAL55-PrimaryDashboard.ps1'
          $tokens=$null;$errors=$null
          $tree=[Management.Automation.Language.Parser]::ParseFile($filename,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'FIAL55_DASHBOARD_DEPLOY_PARSE_HOLD'}
          $functions=$tree.FindAll({param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'ReadyNew'
          },$true)
          if(@($functions).Count -ne 1){throw 'FIAL55_DASHBOARD_READINESS_NOT_UNIQUE'}
          $fixture=@'
          Set-StrictMode -Version Latest
          $Runner='C:\test\scripts\Run-Fun-ML-Dashboard8802.mjs'
          $Url='http://127.0.0.1:8802'
          $OldCommerceShopifyConfigured=$false
          $ElevateReal=$false
          function Hold([string]$message){throw ('MOCK_HOLD='+$message)}
          function Owner([int]$port){
            if($port -ne 8802){throw 'WRONG_PORT'}
            return [pscustomobject]@{ProcessId=9988;CommandLine=('node.exe "'+$Runner+'" --serve')}
          }
          function GetJson([string]$path){
            switch($path){
              '/api/fun/hub/status' {return [pscustomobject]@{version='fi-ml-hub-v3'}}
              '/api/ml/dashboard/status' {return [pscustomobject]@{state='ready'}}
              '/api/fial/grounded/status' {return [pscustomobject]@{
                version='fial5.3-primary-grounded-chat-v1';model_interface='fixed_local_qwen_8088'
                memory_interface='fixed_readonly_cognee_8789';authority_added=$false;tool_executions=0}}
              '/api/commerce/status' {return [pscustomobject]@{version='commerce';shopify=[pscustomobject]@{configured=$false}}}
              '/api/unified/status' {return [pscustomobject]@{state='ready'}}
              '/api/operator/status' {return [pscustomobject]@{
                version='fial5.4-executive-operator-v1';console_version='fial5.4-executive-console-v1'
                outbound_permissions=[pscustomobject]@{email_sent=0;government_filings=0;spent_usd=0;rea_runs=0}}}
              '/api/operator/real/status' {return [pscustomobject]@{
                version='fial5.5-real-business-operations-v1'
                company_identity_status='OPERATOR_PROVIDED_NOT_OFFICIALLY_VERIFIED'
                government_filings=$(if($ElevateReal){1}else{0});emails_sent=0;payments=0;rea_executions=0;applied_configs=0}}
              default {throw ('UNKNOWN_GET_JSON='+$path)}
            }
          }
          function Invoke-WebRequest {
            param([string]$Uri,[switch]$UseBasicParsing,[int]$TimeoutSec)
            if($Uri.EndsWith('/unified/?view=chat')){
              return [pscustomobject]@{StatusCode=200;Content='id="fi-fial53-grounded" id="action-review" fi-ml-panel fi-commerce-panel'}
            }
            if($Uri.EndsWith('/api/fial/grounded/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent x-fi-chat-click'}
            }
            if($Uri.EndsWith('/operations/')){
              return [pscustomobject]@{StatusCode=200;Content='fi-exec-queue Executive Assistant fi-real-work'}
            }
            if($Uri.EndsWith('/api/operator/client.js') -or $Uri.EndsWith('/api/operator/real/client.js')){
              return [pscustomobject]@{StatusCode=200;Content='textContent'}
            }
            if($Uri.EndsWith('/')){
              return [pscustomobject]@{StatusCode=200;Content='fi-ui-shell'}
            }
            throw ('UNKNOWN_HTTP='+$Uri)
          }
          $originalHome=$HOME
          ReadyNew 9988
          if($HOME -cne $originalHome){throw 'FIAL55_READINESS_MUTATED_HOME'}
          $ElevateReal=$true
          $held=$false
          try{ReadyNew 9988}catch{
            if([string]$_.Exception.Message -match 'NEW_DASHBOARD_HEALTH_OR_POLICY_MISMATCH'){$held=$true}
            else{throw}
          }
          if(!$held){throw 'FIAL55_DASHBOARD_ACCEPTED_UNAUTHORIZED_FILING'}
          $held=$false
          try{ReadyNew 9999}catch{
            if([string]$_.Exception.Message -match 'NEW_8802_OWNER_DRIFT'){$held=$true}
            else{throw}
          }
          if(!$held){throw 'FIAL55_DASHBOARD_ACCEPTED_WRONG_PID'}
          Write-Host 'FIAL55_REAL_POWERSHELL_READINESS=PASS'
          '@
          & ([scriptblock]::Create($functions[0].Extent.Text+[Environment]::NewLine+$fixture))
      - name: Protect only 8802 replacement with pinned FIAL5.4 rollback source
        shell: pwsh
        run: |
          $s=Get-Content 'Deploy-Fun-FIAL55-PrimaryDashboard.ps1' -Raw
          foreach($required in @('FIAL55_PRIMARY_DASHBOARD_CONSOLIDATION=PASS',
             'FIAL55_ROLLBACK_OLD_PRIMARY_DASHBOARD=PASS',
             'OLD_DASHBOARD_SOURCE_NOT_REVIEWED',
             'PROTECTED_PROCESS_CHANGED_PORT_',
             'REAL_OPERATIONS_SCHEDULE_NOT_VERIFIED',
             'FIAL55_REAL_WORK_RECEIPT_MISSING')){
            if(!$s.Contains($required)){throw ('FIAL55_ROLLBACK_GUARD_MISSING='+$required)}
          }
          if($s -match '(?im)^\s*\$(home|pid|host)\s*=' -or
             $s -match '(?<!@)\(Listeners 8802\)\.Count'){
            throw 'FIAL55_DEPLOY_STRICTMODE_REGRESSION'
          }
          Write-Host 'FIAL55_PINNED_ROLLBACK_GUARDS=PASS'
      - name: Prohibit public business contact details in repository code
        shell: pwsh
        run: |
          $files=@('src/operator/real-operations-v5-5.mjs',
            'src/operator/official-source-watch-v5-5.mjs',
            'scripts/Run-Fun-Real-Operations-V5-5.mjs',
            'Run-Fun-Real-Operations-V5-5.ps1',
            'Install-Fun-Real-Operations-V5-5.ps1')
          $content=($files|ForEach-Object{Get-Content $_ -Raw}) -join ''
          if($content.Contains('760-912-0784') -or $content.Contains('13479 abbot') -or
             $content.Contains('B20260233096') -or $content.Contains('elektronindustrial@gmail.com')){
            throw 'FIAL55_PRIVATE_BUSINESS_DETAILS_FOUND_IN_PUBLIC_SOURCE'
          }
          Write-Host 'FIAL55_NO_PRIVATE_PROFILE_IN_GITHUB=PASS'
